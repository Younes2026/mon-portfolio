<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="av-cl"><rect x="60"  y="89" width="34" height="21" rx="5"/></clipPath>
    <clipPath id="av-cr"><rect x="106" y="89" width="34" height="21" rx="5"/></clipPath>
    <clipPath id="av-hair"><rect x="28" y="14" width="144" height="64"/></clipPath>
  </defs>

  <!-- Ears -->
  <ellipse cx="34"  cy="108" rx="11" ry="14" fill="#F5D5B8"/>
  <ellipse cx="34"  cy="108" rx="5.5" ry="8" fill="#E8C4A0"/>
  <ellipse cx="166" cy="108" rx="11" ry="14" fill="#F5D5B8"/>
  <ellipse cx="166" cy="108" rx="5.5" ry="8" fill="#E8C4A0"/>

  <!-- Face -->
  <circle cx="100" cy="106" r="66" fill="#F5D5B8"/>

  <!-- Hair -->
  <circle cx="100" cy="106" r="70" fill="#1a1a1a" clip-path="url(#av-hair)"/>

  <!-- Eyebrows -->
  <path d="M 62,80 Q 74,75 85,79"  stroke="#5a3a1a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 115,79 Q 126,75 138,80" stroke="#5a3a1a" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Eyes -->
  <circle cx="79"  cy="99" r="7.5" fill="#0d0700"/>
  <circle cx="79"  cy="99" r="3.8"  fill="#3d1f00"/>
  <circle cx="81"  cy="97" r="2.2"  fill="white" opacity="0.7"/>
  <circle cx="121" cy="99" r="7.5" fill="#0d0700"/>
  <circle cx="121" cy="99" r="3.8"  fill="#3d1f00"/>
  <circle cx="123" cy="97" r="2.2"  fill="white" opacity="0.7"/>

  <!-- Nose -->
  <path d="M 96,113 Q 100,120 104,113" stroke="#C4907A" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.55"/>
  <ellipse cx="95"  cy="121" rx="3" ry="2" fill="#C4907A" opacity="0.4"/>
  <ellipse cx="105" cy="121" rx="3" ry="2" fill="#C4907A" opacity="0.4"/>

  <!-- Glasses left -->
  <rect x="58"  y="88" width="36" height="23" rx="6.5" fill="rgba(26,26,46,0.2)" stroke="#1a1a2e" stroke-width="2.5"/>
  <!-- Glasses right -->
  <rect x="105" y="88" width="36" height="23" rx="6.5" fill="rgba(26,26,46,0.2)" stroke="#1a1a2e" stroke-width="2.5"/>
  <!-- Bridge -->
  <path d="M 94,99 C 96,95 103,95 106,99" stroke="#1a1a2e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Temples -->
  <line x1="58"  y1="99" x2="44"  y2="107" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="141" y1="99" x2="155" y2="107" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Smile -->
  <path d="M 83,139 Q 100,153 117,139" stroke="#A07060" stroke-width="2.5" fill="none" stroke-linecap="round"/>
